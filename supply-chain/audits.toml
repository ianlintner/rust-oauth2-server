[[audits.utoipa-swagger-ui]]
who = "Ian Lintner (@ianlintner), owner approval of AI-assisted review"
criteria = "safe-to-deploy"
version = "10.0.1"
importable = false
notes = """
Owner-authorized human attestation of AI-assisted review evidence, 2026-10-02.
Scope is the PUBLISHED utoipa-swagger-ui 10.0.1 crate
(checksum 3f5ec9d7816e4ce8ccb7e0bd7276e090cad0fcb1def4f3540e5b0f7485d7583e),
vendored locally under vendor/utoipa-swagger-ui-10.0.1 and consumed through a
[patch.crates-io] path override, resolved with features {actix-web, default,
url}. IMPORTANT cargo-vet MECHANICS: because this package is a local path
override, config.toml sets [policy."utoipa-swagger-ui:10.0.1"]
audit-as-crates-io = true, which requires an audit for the published 10.0.1
version ONLY. cargo-vet has no hash of the local, patched tree and does not
vouch for it; a local path audit is NOT equal to auditing the modified source.
The only authorized delta from the published crate is a base64 dependency
declaration change (default-features = false, features = ["std"]) that keeps
base64 0.23.1 in its scalar std+alloc configuration and excludes simd-unsafe.
Integrity of the vendored tree and of that single delta is enforced separately
and fail-closed by scripts/check_utoipa_stack_scope.py (whole-tree SHA-256 of
all 14 files, exact version/path/features) which runs before `cargo vet` in CI.
This is not an independent third-party audit, not an all-features audit, and
not merge approval.
Bounded source evidence and limitations:
docs/security/utoipa-swagger-ui-source-review.md.
"""

