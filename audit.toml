# Configuration for cargo-audit
# This file configures which advisories to ignore
#
# IMPORTANT: deny.toml is the primary policy file for cargo-deny.
# This file is used only by `cargo audit` (standalone).

[advisories]
# Ignore advisories with no upstream fix yet.

# RUSTSEC-2023-0071: Marvin Attack — RSA PKCS#1 v1.5 timing side-channel
# Affected crate: rsa 0.9.x
# Affected code paths:
#   - jsonwebtoken (JWT RS256 signing/verification)
#   - oauth2-actix admin_keys handler (RSA key generation for JWKS)
# Status: No fix available upstream (rsa crate). Tracked for migration to
#         ES256 (P-256) or EdDSA which eliminates RSA entirely.
# Severity: Medium (CVSS 5.9) — requires network access to exploit timing.
# Review date: 2025-04-13
# Next review: Remove this suppression once rsa >= 0.10 ships a fix.

# RUSTSEC-2026-0119: CPU exhaustion in hickory-proto during message encoding
# Affected path: hickory-proto 0.25.2 ← mongodb 3.6.0 (with dns-resolver feature)
# Fix available in hickory-proto 0.26.1, but mongodb 3.6.0 constrains to 0.25.x
# Waiting for mongodb 3.7+ or alternate solution. Limited impact: DNS encoding
# only triggered by mongodb driver's internal DNS resolution, not user input.
# Review date: 2026-05-01
# Next review: Remove once mongodb updates to hickory-proto 0.26+

# RUSTSEC-2026-0118: NSEC3 validation loop in hickory-proto
# Affected path: hickory-proto 0.25.2 ← mongodb 3.6.0 (with dns-resolver feature)
# No fix available yet (advisory issued 2026-05-01). Limited impact: DNSSEC
# validation only affects NSEC3 records, not typical mongodb usage scenarios.
# Review date: 2026-05-01
# Next review: Remove once hickory-proto ships a fix and mongodb updates

ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0119",
    "RUSTSEC-2026-0118",
]
